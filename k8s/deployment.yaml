# Kubernetes Deployment — devops-demo-app
#
# Desired state: keep 3 identical pods running at all times.
# If a pod crashes, Kubernetes automatically restarts it (self-healing demo).
#
# imagePullPolicy: Never — uses image loaded via `minikube image load`.
# Change to IfNotPresent when pulling from a real registry.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-app
  labels:
    app: devops-demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-demo-app
  template:
    metadata:
      labels:
        app: devops-demo-app
    spec:
      containers:
        - name: devops-demo-app
          image: devops-demo-app
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
